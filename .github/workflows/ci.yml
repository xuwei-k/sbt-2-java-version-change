on:
  pull_request:
  push:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6
    - uses: sbt/setup-sbt@v1
    - run: curl -s "https://get.sdkman.io?ci=true" | bash
    - run: |
        source "${HOME}/.sdkman/bin/sdkman-init.sh"
        sdk install java 21.0.11-amzn
        sdk install java 17.0.19-amzn
    - run: |
        source "${HOME}/.sdkman/bin/sdkman-init.sh"
        sdk use java 21.0.11-amzn
        java --version
        sbt --server compile
    - run: |
        mkdir -p b/src/main/scala
        cp change/* b/src/main/scala/
    - run: |
        source "${HOME}/.sdkman/bin/sdkman-init.sh"
        sdk use java 17.0.19-amzn
        java --version
        sbt --server compile
